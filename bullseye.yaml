# bullseye.yaml — convergence targets for this project.
#
# Targets are desired project states expressed as testable properties,
# with dependency tracking and frontier computation. This file is the
# source of truth: read and written by the bullseye MCP server, and safe
# to hand-edit (the targets live below).
#
# What is bullseye / how do I install it?
#   https://github.com/marcelocantos/bullseye
#
# This banner is regenerated by bullseye on every write — edit the
# targets, not these lines.
schema_version: 5
targets:
  T1:
    name: Running Claude Code sessions are visible as characters in a 2D open-plan office
    status: achieved
    value: 5.0
    cost: 3.0
    acceptance:
    - '`./run.sh` serves the office on localhost with python3 alone — no pip install, no build step'
    - 'One floor with four zones: open plan, research library, meeting room, water cooler; empty zones are dark'
    - 'Each live session in `~/.claude/sessions/*.json` with a living pid becomes a character with a stable cute name and an inferred job title'
    - 'A session walks to the zone matching what it is doing, and fades between zones rather than through walls'
    - 'Idle sessions stand at the water cooler and hold short paired conversations'
    - 'Open-plan desks are clustered per repo, with the repo named on a placard'
    - 'The library shelves show the active repos'' markdown; the meeting room board shows the live todo list'
    - 'Clicking a zone zooms in; esc zooms out; hovering a character, the shelves or the board shows detail'
    - 'Zoom snaps to whole-number scale and all in-world text is bitmap, so nothing is smoothed'
    - '`python3 -m unittest discover -s tests` passes'
    context: 'Read-only over ~/.claude. Live sessions come from sessions/<pid>.json (status field plus a pid liveness check); per-session detail comes from tailing the last 64KB of that session''s transcript JSONL. Sprites are generated procedurally from a hash of the session id and the bitmap font is thresholded from the system monospace at runtime, so there are no art assets to ship or license. Zone rules live in limen/zones.py.'
    tags:
    - viz
    - tooling
    origin: hand
    discovered: 2026-09-29
    achieved: 2026-09-29
  T2:
    name: The office stays readable when many sessions run at once
    status: active
    value: 3.0
    cost: 2.0
    acceptance:
    - 'A zone holding more people than it has standing spots still places everyone without stacking sprites'
    - 'Speech bubbles never overlap each other, at any cooler occupancy'
    - 'Open-plan desk clusters stay inside the wall as the number of concurrent sessions grows'
    context: 'Exercised with ten concurrent sessions. Library/meeting/cooler spot lists in web/js/zones.js are fixed-length and wrap with modulo, so an eleventh person in one zone stands on someone. Desk clusters squeeze their pitch to fit but bottom out at 22px. Speech bubbles avoid collision by a two-level lift, which only holds for two simultaneous pairs.'
    tags:
    - viz
    origin: hand
    discovered: 2026-09-29
  T3:
    name: Sessions that have ended recently still leave a trace in the office
    status: active
    value: 2.0
    cost: 2.0
    acceptance:
    - 'A session that ended within some recent window appears as a faded or sleeping sprite rather than vanishing instantly'
    - 'Zone occupancy counts distinguish "working now" from "was working recently"'
    context: 'Deliberately out of scope for the first build, which is strictly live-only. Transcripts carry the history needed (timestamps on every record); the question is decay policy, not data.'
    tags:
    - viz
    origin: hand
    discovered: 2026-09-29
